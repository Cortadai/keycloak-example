# Configuración de API Resource Server con Keycloak
# Configuración para comunicación machine-to-machine (M2M)
#
# Esta API actúa como Resource Server que valida tokens JWT de Keycloak.
# No gestiona el flujo de autenticación (oauth2Login), solo valida tokens.
#
# Flujo machine-to-machine:
# 1. El cliente (otra app/servicio) obtiene un token de Keycloak usando Client Credentials
#    POST http://localhost:9090/realms/mi-realm/protocol/openid-connect/token
#    Body: grant_type=client_credentials&client_id=xxx&client_secret=xxx
#
# 2. El cliente envía requests a esta API con el token:
#    GET http://localhost:8081/api/user/me
#    Header: Authorization: Bearer {token}
#
# 3. Esta API valida el token JWT contra Keycloak y responde

server:
  port: 8081  # Puerto de esta API

spring:
  application:
    name: keycloak-spring-demo-api

  security:
    oauth2:
      # Configuración de Resource Server (para validar tokens JWT)
      resourceserver:
        jwt:
          # URL para obtener las claves públicas que validan los JWT
          # Keycloak expone sus claves públicas en este endpoint
          jwk-set-uri: http://localhost:9090/realms/mi-realm/protocol/openid-connect/certs
          # Issuer esperado en los tokens (debe coincidir con el claim 'iss' del JWT)
          issuer-uri: http://localhost:9090/realms/mi-realm

# Configuración de logging para ver qué está pasando
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG

---
# Perfil de desarrollo local
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.example.keycloak: DEBUG

---
# Perfil de producción (ejemplo)
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    org.springframework.security: INFO
    com.example.keycloak: INFO
