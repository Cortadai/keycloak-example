# Configuración de la aplicación Spring Boot con Keycloak
# Patrón BFF (Backend for Frontend) con Headers Bearer

server:
  port: 8081

spring:
  application:
    name: keycloak-spring-demo

  # Configuración de Redis para almacenar tokens
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms

  # Configuración de OAuth2 Client (para login)
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: spring-boot-client
            client-secret: tu-secreto-de-cliente-de-prueba
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
        provider:
          keycloak:
            issuer-uri: http://localhost:9090/realms/mi-realm
            authorization-uri: http://localhost:9090/realms/mi-realm/protocol/openid-connect/auth
            token-uri: http://localhost:9090/realms/mi-realm/protocol/openid-connect/token
            user-info-uri: http://localhost:9090/realms/mi-realm/protocol/openid-connect/userinfo
            jwk-set-uri: http://localhost:9090/realms/mi-realm/protocol/openid-connect/certs
            user-name-attribute: preferred_username

      # Configuración de Resource Server (para validar Bearer tokens)
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9090/realms/mi-realm/protocol/openid-connect/certs
          issuer-uri: http://localhost:9090/realms/mi-realm

# Configuración personalizada para la aplicación BFF
app:
  frontend:
    url: http://localhost:4200

  # Configuración de Keycloak para revocación de tokens
  keycloak:
    revoke-uri: http://localhost:9090/realms/mi-realm/protocol/openid-connect/revoke

  # Configuración del JWT propio con fingerprint (binding)
  jwt:
    # Secret para firmar JWT (en producción usar variable de entorno)
    secret: ${JWT_SECRET:mi-secret-super-seguro-para-jwt-binding-debe-tener-al-menos-256-bits}
    # TTL del access token en segundos (15 minutos)
    expiration: 900

  # Configuración de la cookie de fingerprint
  fingerprint:
    cookie-name: Fingerprint
    # HttpOnly: JavaScript no puede leerla (protección XSS)
    http-only: true
    # Secure: Solo viaja por HTTPS (false para desarrollo local)
    secure: false
    # SameSite: No se envía en requests cross-site
    same-site: Strict
    # Path: Válida para todo el dominio
    path: /
    # Max-Age: Mismo TTL que el access token (15 min = 900s)
    max-age: 900

# Configuración de logging
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.data.redis: DEBUG
    com.example.keycloak: DEBUG
