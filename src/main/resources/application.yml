# ============================================================================
# Configuración de Spring Boot para SPA con Authorization Code + PKCE
# ============================================================================
#
# Esta configuración implementa un Resource Server que valida tokens JWT
# provenientes de un SPA (Angular/React/Vue) que usa Authorization Code + PKCE.
#
# ¿Qué hace esta configuración?
# - Valida tokens JWT que vienen en el header Authorization
# - Extrae roles del token para control de acceso
# - NO gestiona el login (el SPA lo hace directamente con Keycloak)
#
# Diferencias con otras ramas:
# - main: Resource Server básico educativo
# - oauth2-resource-server: M2M con Client Credentials
# - oauth2-bff: BFF con cookies HttpOnly (más seguro)
# - oauth2-spa-pkce (esta rama): SPA tradicional con PKCE
# ============================================================================

server:
  port: 8081  # Puerto diferente al de Keycloak (que usa 9090)

spring:
  application:
    name: keycloak-spring-demo-spa

  security:
    oauth2:
      # Configuración de Resource Server
      # Solo necesitamos validar tokens JWT que vienen del SPA
      resourceserver:
        jwt:
          # issuer-uri: Spring obtiene AUTOMÁTICAMENTE toda la configuración
          # (jwk-set-uri, issuer, etc.) desde el endpoint de OpenID Connect
          issuer-uri: http://localhost:9090/realms/mi-realm

# Configuración personalizada para la aplicación SPA
app:
  # URL del frontend SPA (para CORS y redirecciones)
  frontend:
    url: http://localhost:4200

# Configuración de logging para ver qué está pasando
logging:
  level:
    org.springframework.security: INFO
    org.springframework.security.oauth2: DEBUG
    com.example.keycloak: DEBUG

---
# Perfil de desarrollo local
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    org.springframework.security: DEBUG
    com.example.keycloak: DEBUG

---
# Perfil de producción (ejemplo)
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    org.springframework.security: INFO
    org.springframework.security.oauth2: WARN
    com.example.keycloak: INFO
