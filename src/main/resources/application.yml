# Configuración de la aplicación Spring Boot con Keycloak
# Patrón BFF (Backend for Frontend) con Headers Bearer

server:
  port: 8081

spring:
  application:
    name: keycloak-spring-demo

  # Configuración de Redis para almacenar tokens
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms

  # Configuración de OAuth2 Client (para login)
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: spring-boot-client
            client-secret: fzmAdt2kAN6QOYWzD7lFkM6CxTsl8W5h
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
        provider:
          keycloak:
            issuer-uri: http://localhost:9090/realms/mi-realm
            authorization-uri: http://localhost:9090/realms/mi-realm/protocol/openid-connect/auth
            token-uri: http://localhost:9090/realms/mi-realm/protocol/openid-connect/token
            user-info-uri: http://localhost:9090/realms/mi-realm/protocol/openid-connect/userinfo
            jwk-set-uri: http://localhost:9090/realms/mi-realm/protocol/openid-connect/certs
            user-name-attribute: preferred_username

      # Configuración de Resource Server (para validar Bearer tokens)
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9090/realms/mi-realm/protocol/openid-connect/certs
          issuer-uri: http://localhost:9090/realms/mi-realm

# Configuración personalizada para la aplicación BFF
app:
  frontend:
    url: http://localhost:4200

  # Configuración de Keycloak para revocación de tokens
  keycloak:
    revoke-uri: http://localhost:9090/realms/mi-realm/protocol/openid-connect/revoke

# Configuración de logging
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.data.redis: DEBUG
    com.example.keycloak: DEBUG
