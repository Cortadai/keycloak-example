# ============================================================================
# Configuración BÁSICA EDUCATIVA de Spring Boot con Keycloak
# ============================================================================
#
# Esta es la configuración MÁS SIMPLE para aprender Keycloak con Spring Boot.
#
# ¿Qué hace esta configuración?
# - Valida tokens JWT que vienen de Keycloak
# - Extrae roles del token para control de acceso
# - NO gestiona el login (eso lo hace Keycloak directamente)
#
# Para aprender más:
# - Rama 'oauth2-resource-server': APIs M2M con Client Credentials
# - Rama 'oauth2-bff': SPAs con Authorization Code + BFF
# ============================================================================

server:
  port: 8081  # Puerto de nuestra API (Keycloak usa 9090)

spring:
  application:
    name: keycloak-spring-demo-basic

  security:
    oauth2:
      # Configuración de Resource Server
      # Solo necesitamos decirle a Spring dónde está Keycloak
      resourceserver:
        jwt:
          # issuer-uri: Spring obtiene AUTOMÁTICAMENTE toda la configuración desde aquí
          # (authorization-uri, token-uri, jwk-set-uri, etc.)
          issuer-uri: http://localhost:9090/realms/mi-realm

# Logging para aprendizaje (ver qué está pasando)
logging:
  level:
    org.springframework.security: INFO
    org.springframework.security.oauth2: DEBUG
    com.example.keycloak: DEBUG

---
# Perfil de desarrollo local
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.example.keycloak: DEBUG

---
# Perfil de producción (ejemplo)
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    org.springframework.security: INFO
    com.example.keycloak: INFO
